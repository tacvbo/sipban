# Configuration for the tests: TESTDIR is replaced with the path of test/.
# Small thresholds and a fast contact refresh, so the scenario runs in
# seconds.

[ami]
port = "15038"
user = "sipban"
pass = "getout"
host = "127.0.0.1"
ping = 60

[control]
port = "14451"
address = "127.0.0.1"

[iptables]
path       = "TESTDIR/bin/"
rule       = "DROP"
white_list = "TESTDIR/work/sipban.wl"
interface  = "br0"

[ipset]
path     = "TESTDIR/bin/"
set_name = "sipban"
dump     = "TESTDIR/work/sipban.dump"
timeout  = 604800

[log]
file = "TESTDIR/work/sipban.log"

[flood]
count=3
interval=10
grace=1

[trust]
ttl=3600
refresh=2
max_failures=4
interval=60
