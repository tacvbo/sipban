# Configuration for the tests in the format of version 1.0: without the
# [trust] section and without flood.grace, so sipban uses its defaults.
# TESTDIR is replaced with the path of test/.

[ami]
port = "15038"
user = "sipban"
pass = "getout"
host = "127.0.0.1"
ping = 60

[control]
port = "14451"
address = "127.0.0.1"

[iptables]
path       = "TESTDIR/bin/"
chain      = "sipban"
scope      = ""
rule       = "DROP"
white_list = "TESTDIR/work/sipban.wl"
interface  = "br0"

[ipset]
path     = "TESTDIR/bin/"
set_name = "sipban"
dump     = "TESTDIR/work/sipban.dump"
timeout  = 604800

[log]
file = "TESTDIR/work/sipban.log"

[flood]
count=5
interval=10
